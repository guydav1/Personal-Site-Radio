<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="favicon.svg">
    <title>Radio</title>

    <style>
        html {
            font-family: sans-serif;
            line-height: 1.2em;
            background-color: rgb(0, 0, 0);
        }

        .player {
            margin: 0 auto;
            padding: 1% 1.5em;
            margin-top: 5%;
            width: 300px;
            background-color: white;
            border-radius: 5px;
            box-shadow: 1px 1px 5px rgb(139, 139, 139);
        }

        .header {
            padding: 3%;
            text-align: center;
        }

        #title {
            margin: 0 0 0.4em;
            font-size: 1.4em;
        }

        .now-playing {
            margin: 0.5em 0 1em;
            padding: 0.75em;
            background: rgba(0, 0, 0, 0.06);
            border-radius: 5px;
            text-align: center;
        }

        .now-playing-label {
            font-size: 0.75em;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            color: #666;
            margin-bottom: 0.35em;
        }

        #songMeta {
            font-size: 1em;
            line-height: 1.35em;
            min-height: 1.35em;
            word-break: break-word;
        }

        #songMeta.unknown {
            color: #888;
            font-style: italic;
        }

        .meta-actions {
            display: flex;
            gap: 0.15em;
            margin-top: 0.65em;
            justify-content: center;
            align-items: center;
        }

        button.icon-btn {
            border: none;
            background: transparent;
            color: #777;
            width: 2rem;
            height: 2rem;
            padding: 0;
            border-radius: 999px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: color 0.15s ease, background 0.15s ease;
        }

        button.icon-btn svg {
            width: 1.05rem;
            height: 1.05rem;
            display: block;
        }

        button.icon-btn:hover:not(:disabled) {
            color: #222;
            background: rgba(0, 0, 0, 0.06);
        }

        button.icon-btn:disabled {
            opacity: 0.28;
            cursor: default;
        }

        button.icon-btn.busy {
            color: #222;
            animation: pulse 1s ease-in-out infinite;
        }

        @keyframes pulse {
            50% { opacity: 0.35; }
        }

        #downloadStatus {
            margin-top: 0.45em;
            font-size: 0.75em;
            color: #888;
            min-height: 1.1em;
        }

        #channels {
            line-height: 2em;
            list-style-type: none;
            padding: 0;
            margin: 0 0 1em;
        }

        li {
            text-align: center;
            background-color: rgba(0, 0, 0, 0.2);
            width: 200px;
            padding: 5px;
            margin: 10px auto;
            border-radius: 5px;
        }

        li:hover {
            background-color: rgba(0, 0, 0, 0.1);
            cursor: pointer;
        }

        li.active {
            background-color: rgba(0, 0, 0, 0.45);
            color: #fff;
        }

        audio {
            width: 100%;
        }
    </style>
</head>

<body>

    <div class="player">
        <div class="header">
            <h1 id="title">Playing: ...</h1>
        </div>

        <div class="now-playing">
            <div class="now-playing-label">Now playing</div>
            <div id="songMeta" class="unknown">Waiting for song info…</div>
            <div class="meta-actions">
                <button id="downloadBtn" class="icon-btn" type="button" title="Download MP3" aria-label="Download MP3" disabled>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M12 3v12"></path>
                        <path d="m7 11 5 5 5-5"></path>
                        <path d="M5 21h14"></path>
                    </svg>
                </button>
                <button id="youtubeBtn" class="icon-btn" type="button" title="Open on YouTube" aria-label="Open on YouTube" disabled>
                    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                        <path d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.5 12 3.5 12 3.5s-7.5 0-9.4.6A3 3 0 0 0 .5 6.2 31.5 31.5 0 0 0 0 12a31.5 31.5 0 0 0 .5 5.8 3 3 0 0 0 2.1 2.1c1.9.6 9.4.6 9.4.6s7.5 0 9.4-.6a3 3 0 0 0 2.1-2.1A31.5 31.5 0 0 0 24 12a31.5 31.5 0 0 0-.5-5.8ZM9.75 15.5v-7l6.5 3.5-6.5 3.5Z"></path>
                    </svg>
                </button>
                <button id="identifyBtn" class="icon-btn" type="button" title="Identify song (AudD — click only)" aria-label="Identify song">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M4 10v4"></path>
                        <path d="M8 7v10"></path>
                        <path d="M12 4v16"></path>
                        <path d="M16 7v10"></path>
                        <path d="M20 10v4"></path>
                    </svg>
                </button>
            </div>
            <div id="downloadStatus"></div>
        </div>

        <div class="body">
            <ul id="channels"></ul>
        </div>
        <audio id="player" controls></audio>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.6.7/dist/hls.min.js"></script>
    <script>
        let selectedChannel = parseInt(localStorage.getItem('lastSelectedChannel'), 10) || 0;
        const player = document.getElementById('player');
        const songMetaEl = document.getElementById('songMeta');
        const downloadBtn = document.getElementById('downloadBtn');
        const youtubeBtn = document.getElementById('youtubeBtn');
        const identifyBtn = document.getElementById('identifyBtn');
        const downloadStatus = document.getElementById('downloadStatus');
        let hlsPlayer = null;
        let awaitingPlayGesture = false;
        let ytCache = { key: '', video: null };

        const channels = [
            {
                id: 0,
                name: 'Glgltz',
                src: 'https://glzwizzlv.bynetcdn.com/glglz_mp3',
                // Only this CDN allows the Icy-MetaData request header from browsers.
                icy: true,
                meta: { type: 'radioMenu', slug: 'glz-co-il-galgalatz' }
            },
            {
                id: 1,
                name: 'Eco',
                src: 'https://eco01.livecdn.biz/ecolive/99fm_aac/icecast.audio',
                icy: false,
                meta: { type: 'ecoFirestore' }
            },
            {
                id: 2,
                name: '88FM',
                // Official Kan HLS — avoids StreamTheWorld connection preroll ads.
                src: 'https://kancdn.medonecdn.net/livehls/oil/kancdn-live/live/radio/kan_88/live.livx/playlist.m3u8?renditions&dvr=7200000',
                hls: true,
                // Progressive MP3 for identify clips (HLS playlist is not raw audio).
                clipSrc: 'https://playerservices.streamtheworld.com/api/livestream-redirect/KAN_88.mp3',
                icy: false,
                meta: { type: 'kanAcr', channelId: 4 }
            },
            {
                id: 3,
                name: '107.5FM',
                src: 'https://cdn88.mediacast.co.il/1075-hfa-live/radiohaifa/icecast.audio',
                icy: false,
                meta: null
            },
            {
                id: 4,
                name: '106FM',
                src: 'https://live.ecast.co.il/stream/galimlive',
                icy: false,
                meta: {
                    type: 'ecastPlayerInfo',
                    url: 'https://live.ecast.co.il/AudioPlayer/galimlive/playerInfo'
                }
            }
        ];

        const PIPED_INSTANCES = [
            'https://api.piped.private.coffee',
            'https://pipedapi.adminforge.de',
            'https://pipedapi.kavin.rocks'
        ];

        const SOURCE_PRIORITY = {
            official: 4,
            identify: 3,
            icy: 2,
            playlist: 1
        };

        const IDENTIFY_CLIP_MS = 5000;

        let currentSong = null;
        let icyAbort = null;
        let metaPollTimer = null;
        let downloadBusy = false;
        let identifyBusy = false;
        let metaChannelId = null;

        const channelsList = document.getElementById('channels');
        channels.forEach(channel => {
            const li = document.createElement('li');
            li.textContent = channel.name;
            li.dataset.id = String(channel.id);
            li.addEventListener('click', () => updateSource(channel.id));
            channelsList.appendChild(li);
        });

        function getChannel(channelId) {
            return channels.find(channel => channel.id == channelId);
        }

        function parseStreamTitle(raw) {
            const title = (raw || '').trim();
            if (!title) return null;

            const parts = title.split(/\s[-–—]\s/);
            if (parts.length >= 2) {
                return {
                    raw: title,
                    artist: parts[0].trim(),
                    title: parts.slice(1).join(' - ').trim()
                };
            }

            return { raw: title, artist: '', title };
        }

        function canDownloadSong(song) {
            return !!(song && song.downloadable !== false && (song.title || song.raw));
        }

        function songPriority(song, source) {
            if (!song && !source) return 0;
            const src = source || (song && song.source);
            let priority = SOURCE_PRIORITY[src] || 0;
            // Program-only placeholders shouldn't block Shazam.
            if (song && song.downloadable === false) {
                priority = Math.min(priority, 1);
            }
            return priority;
        }

        function setSong(song, source, force) {
            if (!song) {
                if (!force && currentSong) return;
                currentSong = null;
                ytCache = { key: '', video: null };
                songMetaEl.textContent = 'Waiting for song info…';
                songMetaEl.classList.add('unknown');
                downloadBtn.disabled = true;
                youtubeBtn.disabled = true;
                return;
            }

            const nextPriority = songPriority(song, source);
            const currentPriority = songPriority(currentSong);

            if (!force && currentSong && nextPriority < currentPriority) {
                return;
            }

            const nextSong = {
                ...song,
                source,
                downloadable: song.downloadable !== false
            };
            if (!currentSong || songCacheKey(currentSong) !== songCacheKey(nextSong)) {
                ytCache = { key: '', video: null };
            }
            currentSong = nextSong;

            const label = currentSong.artist
                ? `${currentSong.artist} — ${currentSong.title}`
                : currentSong.title;
            songMetaEl.textContent = source === 'identify' ? `${label} ✦` : label;
            songMetaEl.classList.toggle('unknown', !currentSong.downloadable);
            downloadBtn.disabled = downloadBusy || !canDownloadSong(currentSong);
            youtubeBtn.disabled = !canDownloadSong(currentSong);
            changeTitle(selectedChannel);

            if (navigator.mediaSession) {
                navigator.mediaSession.metadata = new MediaMetadata({
                    title: currentSong.title || currentSong.raw,
                    artist: currentSong.artist || getChannel(selectedChannel).name,
                    album: getChannel(selectedChannel).name
                });
            }
        }

        function highlightChannel(channelId) {
            channelsList.querySelectorAll('li').forEach(li => {
                li.classList.toggle('active', li.dataset.id === String(channelId));
            });
        }

        function changeTitle(channelId) {
            const channel = getChannel(channelId);
            const t = 'Playing: ' + channel.name;
            document.getElementById('title').innerText = t;
            document.title = currentSong
                ? `${currentSong.title} · ${channel.name}`
                : t;
        }

        async function readIcyMetadata(url, signal) {
            const response = await fetch(url, {
                headers: { 'Icy-MetaData': '1' },
                signal
            });

            const metaInt = parseInt(response.headers.get('icy-metaint') || '0', 10);
            if (!metaInt || !response.body) {
                throw new Error('No ICY metadata on stream');
            }

            const reader = response.body.getReader();
            let leftover = new Uint8Array(0);
            let need = metaInt;
            let phase = 'audio';
            let metaNeed = 0;
            let metaParts = [];

            while (!signal.aborted) {
                const { value, done } = await reader.read();
                if (done) break;

                const merged = new Uint8Array(leftover.length + value.length);
                merged.set(leftover);
                merged.set(value, leftover.length);
                leftover = merged;

                let offset = 0;
                while (true) {
                    if (phase === 'audio') {
                        if (leftover.length - offset < need) {
                            leftover = leftover.slice(offset);
                            break;
                        }
                        offset += need;
                        phase = 'len';
                    } else if (phase === 'len') {
                        if (leftover.length - offset < 1) {
                            leftover = leftover.slice(offset);
                            break;
                        }
                        metaNeed = leftover[offset] * 16;
                        offset += 1;
                        if (metaNeed === 0) {
                            phase = 'audio';
                            need = metaInt;
                        } else {
                            phase = 'meta';
                            metaParts = [];
                        }
                    } else {
                        const avail = leftover.length - offset;
                        if (avail < metaNeed) {
                            metaParts.push(leftover.slice(offset));
                            metaNeed -= avail;
                            leftover = new Uint8Array(0);
                            break;
                        }

                        metaParts.push(leftover.slice(offset, offset + metaNeed));
                        offset += metaNeed;

                        let total = 0;
                        for (const part of metaParts) total += part.length;
                        const buf = new Uint8Array(total);
                        let p = 0;
                        for (const part of metaParts) {
                            buf.set(part, p);
                            p += part.length;
                        }

                        const text = new TextDecoder()
                            .decode(buf)
                            .replace(/\0+$/g, '');
                        const match = /StreamTitle='([^']*)'/.exec(text);
                        const parsed = parseStreamTitle(match ? match[1] : '');
                        if (parsed) setSong(parsed, 'icy');

                        phase = 'audio';
                        need = metaInt;
                        metaParts = [];
                    }
                }
            }

            reader.cancel().catch(() => {});
        }

        function startIcyMonitor(channel) {
            if (icyAbort) icyAbort.abort();
            icyAbort = null;

            // Custom Icy-MetaData header triggers CORS preflight; only use where allowed.
            if (!channel.icy) return;

            icyAbort = new AbortController();
            const run = async () => {
                while (!icyAbort.signal.aborted) {
                    try {
                        await readIcyMetadata(channel.src, icyAbort.signal);
                    } catch (err) {
                        if (icyAbort.signal.aborted) return;
                        // Stop retry storms if this CDN rejects the header.
                        console.log('ICY metadata unavailable for', channel.name);
                        return;
                    }
                    if (icyAbort.signal.aborted) return;
                    await new Promise(r => setTimeout(r, 5000));
                }
            };

            run();
        }

        function firestoreString(fields, key) {
            return fields && fields[key] && fields[key].stringValue
                ? fields[key].stringValue.trim()
                : '';
        }

        function songFromEcoFields(fields) {
            const artist = firestoreString(fields, 'artist_name');
            const title = firestoreString(fields, 'song_name');
            if (title && !/^unknown$/i.test(title)) {
                return parseStreamTitle(artist ? `${artist} - ${title}` : title);
            }

            // Between tracks Eco often only publishes the current program.
            const program = firestoreString(fields, 'program_name');
            const broadcaster = firestoreString(fields, 'broadcaster_name');
            if (!program && !broadcaster) return null;
            return {
                raw: [program, broadcaster].filter(Boolean).join(' · '),
                artist: broadcaster,
                title: program || broadcaster,
                downloadable: false
            };
        }

        async function fetchEcoSong() {
            const url = 'https://firestore.googleapis.com/v1/projects/eco-99-production/databases/(default)/documents/streamed_content/program';

            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error('Eco metadata failed');
                const data = await response.json();
                return songFromEcoFields(data.fields);
            } catch (err) {
                const proxy = await fetch('https://r.jina.ai/' + url, {
                    headers: { Accept: 'text/plain', 'X-Timeout': '20' }
                });
                if (!proxy.ok) throw err;
                const data = extractJsonObject(await proxy.text());
                if (!data || !data.fields) throw err;
                return songFromEcoFields(data.fields);
            }
        }

        function extractJsonObject(text) {
            const start = text.indexOf('{');
            const end = text.lastIndexOf('}');
            if (start < 0 || end <= start) return null;
            try {
                return JSON.parse(text.slice(start, end + 1));
            } catch (err) {
                return null;
            }
        }

        async function fetchKanSong(channelId) {
            const apiUrl = `https://www.kan.org.il/api/arc-cloud/get-live-track-data?channelId=${channelId}`;

            try {
                const response = await fetch(apiUrl, {
                    headers: {
                        Accept: 'application/json',
                        Referer: 'https://www.kan.org.il/content/kan/kan-88/'
                    }
                });
                if (response.ok) {
                    const data = await response.json();
                    if (data && data.title && data.title !== 'Unknown') {
                        const artist = (data.artists || []).join(', ');
                        return parseStreamTitle(artist ? `${artist} - ${data.title}` : data.title);
                    }
                }
            } catch (err) {
                // Cloudflare sometimes blocks direct browser calls; try reader proxy.
            }

            const proxy = await fetch('https://r.jina.ai/' + apiUrl, {
                headers: {
                    Accept: 'text/plain',
                    'X-Timeout': '30',
                    'X-Respond-Timing': 'network-idle'
                }
            });
            if (!proxy.ok) throw new Error('KAN metadata failed');
            const data = extractJsonObject(await proxy.text());
            if (!data || !data.title || data.title === 'Unknown') return null;
            const artist = (data.artists || []).join(', ');
            return parseStreamTitle(artist ? `${artist} - ${data.title}` : data.title);
        }

        async function fetchEcastSong(url) {
            const response = await fetch(url);
            if (!response.ok) throw new Error('ecast metadata failed');
            const data = await response.json();
            return parseStreamTitle(data.nowplaying || '');
        }

        function parseRadioMenuMarkdown(markdown) {
            const section = markdown.match(
                /What playing now[\s\S]*?(?:\n## |\n### Find|\n## Related|$)/i
            );
            if (!section) return null;

            const lines = section[0].split('\n');
            for (const line of lines) {
                const m = line.match(
                    /^\*\s+(?:\d{1,2}:\d{2}\s+)?(.+?)\s[-–—]\s(.+?)\s*$/
                );
                if (m) {
                    return parseStreamTitle(`${m[1].trim()} - ${m[2].trim()}`);
                }

                const solo = line.match(/^\*\s+(?:\d{1,2}:\d{2}\s+)?(.+?)\s*$/);
                if (solo && !/view playlist/i.test(solo[1])) {
                    const text = solo[1].trim();
                    if (text && !/^what playing/i.test(text)) {
                        return parseStreamTitle(text);
                    }
                }
            }
            return null;
        }

        async function fetchRadioMenuSong(slug) {
            const proxyUrl = 'https://r.jina.ai/https://radio.menu/stations/' + slug + '/';
            const response = await fetch(proxyUrl, {
                headers: { Accept: 'text/plain' }
            });
            if (!response.ok) throw new Error('radio.menu fetch failed');
            const markdown = await response.text();
            return parseRadioMenuMarkdown(markdown);
        }

        async function fetchOfficialSong(channel) {
            if (!channel.meta) return null;

            switch (channel.meta.type) {
                case 'ecoFirestore':
                    return fetchEcoSong();
                case 'kanAcr':
                    return fetchKanSong(channel.meta.channelId);
                case 'ecastPlayerInfo':
                    return fetchEcastSong(channel.meta.url);
                case 'radioMenu':
                    return fetchRadioMenuSong(channel.meta.slug);
                default:
                    return null;
            }
        }

        function startMetaPoll(channel) {
            if (metaPollTimer) {
                clearInterval(metaPollTimer);
                metaPollTimer = null;
            }

            metaChannelId = channel.id;
            if (!channel.meta) return;

            const source = channel.meta.type === 'radioMenu' ? 'playlist' : 'official';
            const intervalMs = channel.meta.type === 'radioMenu' ? 45000 : 15000;

            const poll = async () => {
                if (metaChannelId !== channel.id) return;
                try {
                    const song = await fetchOfficialSong(channel);
                    if (metaChannelId !== channel.id) return;
                    if (song) setSong(song, source);
                } catch (err) {
                    // Official lookup is best-effort.
                }
            };

            poll();
            metaPollTimer = setInterval(poll, intervalMs);
        }

        function getAuddToken() {
            return (localStorage.getItem('auddApiToken') || '').trim();
        }

        function promptAuddToken(reason) {
            const message = [
                reason || 'Identify uses AudD (your own free token, ~300 requests).',
                '',
                'Paste api_token from https://dashboard.audd.io',
                '(stored only in this browser):'
            ].join('\n');
            const next = window.prompt(message, getAuddToken());
            if (next === null) return getAuddToken();
            const trimmed = next.trim();
            if (trimmed) localStorage.setItem('auddApiToken', trimmed);
            else localStorage.removeItem('auddApiToken');
            return trimmed;
        }

        function destroyHls() {
            if (!hlsPlayer) return;
            try {
                hlsPlayer.destroy();
            } catch (err) {
                console.log(err);
            }
            hlsPlayer = null;
        }

        function attachChannelSource(channel) {
            destroyHls();
            player.removeAttribute('src');
            player.load();

            if (channel.hls) {
                if (window.Hls && Hls.isSupported()) {
                    hlsPlayer = new Hls({
                        enableWorker: true,
                        lowLatencyMode: true
                    });
                    hlsPlayer.loadSource(channel.src);
                    hlsPlayer.attachMedia(player);
                    hlsPlayer.on(Hls.Events.MANIFEST_PARSED, () => {
                        tryPlay();
                    });
                    return;
                }

                if (player.canPlayType('application/vnd.apple.mpegurl')) {
                    player.src = channel.src;
                    return;
                }

                // Last resort: progressive STW mount (may include preroll).
                player.src = channel.clipSrc || channel.src;
                return;
            }

            player.src = channel.src;
        }

        function waitForAbortOrTimeout(ms, signal) {
            return new Promise((resolve, reject) => {
                if (signal && signal.aborted) {
                    reject(new Error('aborted'));
                    return;
                }

                let timer = null;
                const onAbort = () => {
                    clearTimeout(timer);
                    reject(new Error('aborted'));
                };

                timer = setTimeout(() => {
                    if (signal) signal.removeEventListener('abort', onAbort);
                    resolve();
                }, ms);

                if (signal) signal.addEventListener('abort', onAbort, { once: true });
            });
        }

        function trimToMpegSync(bytes) {
            for (let i = 0; i < bytes.length - 1; i++) {
                if (bytes[i] === 0xff && (bytes[i + 1] & 0xe0) === 0xe0) {
                    return bytes.subarray(i);
                }
            }
            return bytes;
        }

        async function capturePlayerClip(durationMs, signal) {
            const captureFn = player.captureStream || player.mozCaptureStream;
            if (typeof captureFn !== 'function') {
                throw new Error('captureStream unsupported');
            }
            if (player.paused) {
                await player.play();
            }

            const stream = captureFn.call(player);
            if (!stream || !stream.getAudioTracks().length) {
                throw new Error('No audio track to capture');
            }

            const mimeType = [
                'audio/webm;codecs=opus',
                'audio/webm',
                'audio/mp4'
            ].find(type => window.MediaRecorder && MediaRecorder.isTypeSupported(type)) || '';

            const recorder = new MediaRecorder(
                stream,
                mimeType ? { mimeType } : undefined
            );
            const chunks = [];
            recorder.ondataavailable = event => {
                if (event.data && event.data.size) chunks.push(event.data);
            };

            const stopped = new Promise((resolve, reject) => {
                recorder.onstop = resolve;
                recorder.onerror = () => reject(new Error('MediaRecorder failed'));
            });

            recorder.start(200);
            try {
                await waitForAbortOrTimeout(durationMs, signal);
            } finally {
                if (recorder.state !== 'inactive') recorder.stop();
            }
            await stopped;

            const blob = new Blob(chunks, {
                type: recorder.mimeType || mimeType || 'audio/webm'
            });
            if (blob.size < 8000) throw new Error('Audio clip too short');
            return blob;
        }

        async function captureFetchedClip(streamUrl, durationMs, signal) {
            const response = await fetch(streamUrl, { signal });
            if (!response.ok || !response.body) {
                throw new Error('Could not capture stream audio');
            }

            const reader = response.body.getReader();
            const chunks = [];
            const started = Date.now();

            try {
                while (Date.now() - started < durationMs) {
                    if (signal && signal.aborted) throw new Error('aborted');
                    const { value, done } = await reader.read();
                    if (done) break;
                    chunks.push(value);
                }
            } finally {
                reader.cancel().catch(() => {});
            }

            const raw = new Uint8Array(await new Blob(chunks).arrayBuffer());
            const trimmed = trimToMpegSync(raw);
            const type = response.headers.get('content-type') || 'audio/mpeg';
            const blob = new Blob([trimmed], { type: type.split(';')[0] });
            if (blob.size < 40000) throw new Error('Audio clip too short');
            return blob;
        }

        async function captureIdentifyClip(channel, durationMs, signal) {
            try {
                return await capturePlayerClip(durationMs, signal);
            } catch (err) {
                console.log('Player capture failed, falling back to stream fetch', err);
                return captureFetchedClip(
                    channel.clipSrc || channel.src,
                    durationMs,
                    signal
                );
            }
        }

        async function recognizeClip(blob) {
            const token = getAuddToken();
            if (!token) throw new Error('missing AudD api_token');

            const form = new FormData();
            const ext = blob.type.includes('mp4') || blob.type.includes('aac')
                ? 'm4a'
                : blob.type.includes('webm')
                    ? 'webm'
                    : 'mp3';
            form.append('file', blob, `clip.${ext}`);
            form.append('return', 'apple_music,spotify');
            form.append('api_token', token);

            const response = await fetch('https://api.audd.io/', {
                method: 'POST',
                body: form
            });
            if (!response.ok) throw new Error('Recognition request failed');

            const data = await response.json();
            if (data.status === 'error') {
                throw new Error((data.error && data.error.error_message) || 'Recognition failed');
            }
            if (!data.result || !data.result.title) return null;

            const artist = data.result.artist || '';
            const title = data.result.title || '';
            return parseStreamTitle(artist ? `${artist} - ${title}` : title);
        }

        async function identifyCurrentSong() {
            if (identifyBusy) return null;

            const channel = getChannel(selectedChannel);
            if (!channel) return null;

            if (!getAuddToken()) {
                const token = promptAuddToken();
                if (!token) {
                    downloadStatus.textContent = 'Add an AudD token to identify.';
                    return null;
                }
            }

            identifyBusy = true;
            identifyBtn.disabled = true;
            identifyBtn.classList.add('busy');
            const channelId = channel.id;
            downloadStatus.textContent = 'Listening…';

            const controller = new AbortController();
            const kill = setTimeout(() => controller.abort(), IDENTIFY_CLIP_MS + 8000);

            try {
                const clip = await captureIdentifyClip(
                    channel,
                    IDENTIFY_CLIP_MS,
                    controller.signal
                );
                if (selectedChannel !== channelId) return null;

                downloadStatus.textContent = 'Looking up…';
                const song = await recognizeClip(clip);
                if (selectedChannel !== channelId) return null;

                if (song) {
                    setSong(song, 'identify', true);
                    downloadStatus.textContent = `Identified: ${song.raw}`;
                    return song;
                }

                downloadStatus.textContent = 'Could not identify this moment.';
                return null;
            } catch (err) {
                if (selectedChannel === channelId) {
                    const message = String((err && err.message) || err || '');
                    if (/api_token|authorization failed|limit was reached|missing AudD/i.test(message)) {
                        downloadStatus.textContent = 'AudD token/limit issue.';
                        const token = promptAuddToken('AudD rejected the token or quota is empty.');
                        if (token) {
                            identifyBusy = false;
                            identifyBtn.classList.remove('busy');
                            identifyBtn.disabled = false;
                            clearTimeout(kill);
                            return identifyCurrentSong();
                        }
                    } else {
                        downloadStatus.textContent = 'Identify failed — try during the song.';
                    }
                }
                console.log(err);
                return null;
            } finally {
                clearTimeout(kill);
                identifyBusy = false;
                identifyBtn.classList.remove('busy');
                identifyBtn.disabled = false;
            }
        }

        function clearPlayGestureWait() {
            if (!awaitingPlayGesture) return;
            awaitingPlayGesture = false;
            document.removeEventListener('pointerdown', onPlayGesture);
            document.removeEventListener('keydown', onPlayGesture);
        }

        function onPlayGesture() {
            clearPlayGestureWait();
            tryPlay();
        }

        function waitForPlayGesture() {
            if (awaitingPlayGesture) return;
            awaitingPlayGesture = true;
            if (!downloadStatus.textContent) {
                downloadStatus.textContent = 'Tap anywhere to start audio.';
            }
            document.addEventListener('pointerdown', onPlayGesture);
            document.addEventListener('keydown', onPlayGesture);
        }

        async function tryPlay() {
            try {
                await player.play();
                clearPlayGestureWait();
                if (downloadStatus.textContent === 'Tap anywhere to start audio.') {
                    downloadStatus.textContent = '';
                }
                setControls();
                return true;
            } catch (err) {
                if (err && err.name === 'NotAllowedError') {
                    waitForPlayGesture();
                    return false;
                }
                console.log(err);
                return false;
            }
        }

        function updateSource(channelId) {
            const channel = getChannel(channelId);
            if (!channel) return;

            attachChannelSource(channel);
            selectedChannel = channelId;
            localStorage.setItem('lastSelectedChannel', String(channelId));
            setSong(null, null, true);
            downloadStatus.textContent = '';
            changeTitle(channelId);
            highlightChannel(channelId);
            startIcyMonitor(channel);
            startMetaPoll(channel);
            tryPlay();
        }

        function setControls() {
            if (!navigator.mediaSession) return;

            navigator.mediaSession.setActionHandler('previoustrack', () => {
                if (selectedChannel > 0) {
                    updateSource(selectedChannel - 1);
                }
            });

            navigator.mediaSession.setActionHandler('nexttrack', () => {
                if (selectedChannel < channels.length - 1) {
                    updateSource(selectedChannel + 1);
                }
            });
        }

        function songQuery(song) {
            return song.artist ? `${song.artist} ${song.title}` : song.title || song.raw;
        }

        function songCacheKey(song) {
            return normalizeMatchText(songQuery(song));
        }

        function hasHebrew(value) {
            return /[\u0590-\u05FF]/.test(String(value || ''));
        }

        function normalizeMatchText(value) {
            return String(value || '')
                .toLowerCase()
                .normalize('NFKD')
                .replace(/[\u0300-\u036f]/g, '')
                .replace(/[^\p{L}\p{N}\s]+/gu, ' ')
                .replace(/\s+/g, ' ')
                .trim();
        }

        // Rough Hebrew→Latin so "לאט לאט" can match metadata like "Leat Leat".
        function transliterateHebrewApprox(value) {
            const map = {
                א: 'a', ב: 'b', ג: 'g', ד: 'd', ה: 'h', ו: 'o', ז: 'z', ח: 'h', ט: 't',
                י: 'i', כ: 'k', ך: 'k', ל: 'l', מ: 'm', ם: 'm', נ: 'n', ן: 'n', ס: 's',
                ע: 'a', פ: 'p', ף: 'f', צ: 'tz', ץ: 'tz', ק: 'k', ר: 'r', ש: 'sh', ת: 't',
                װ: 'v', ױ: 'oi', ײ: 'y'
            };
            let out = '';
            for (const ch of String(value || '').replace(/[\u0591-\u05C7]/g, '')) {
                if (map[ch]) out += map[ch];
                else if (/[\u0590-\u05FF]/.test(ch)) continue;
                else out += ch;
            }
            return normalizeMatchText(out);
        }

        function matchTokens(value) {
            const stop = new Set([
                'the', 'a', 'an', 'and', 'or', 'feat', 'ft', 'with', 'official',
                'audio', 'video', 'lyrics', 'lyric', 'hd', 'hq', 'mv'
            ]);
            return normalizeMatchText(value)
                .split(' ')
                .filter(token => token.length > 1 && !stop.has(token));
        }

        function editDistance(a, b) {
            if (a === b) return 0;
            if (!a.length) return b.length;
            if (!b.length) return a.length;
            const prev = new Array(b.length + 1);
            const cur = new Array(b.length + 1);
            for (let j = 0; j <= b.length; j++) prev[j] = j;
            for (let i = 1; i <= a.length; i++) {
                cur[0] = i;
                for (let j = 1; j <= b.length; j++) {
                    const cost = a[i - 1] === b[j - 1] ? 0 : 1;
                    cur[j] = Math.min(cur[j - 1] + 1, prev[j] + 1, prev[j - 1] + cost);
                }
                for (let j = 0; j <= b.length; j++) prev[j] = cur[j];
            }
            return prev[b.length];
        }

        // Hebrew spelling omits vowels: רכבת→rkbt vs radio tag "rakevet".
        function consonantSkeleton(value) {
            return normalizeMatchText(value)
                .replace(/[aeiouy]/g, '')
                .replace(/v/g, 'b'); // ב is often b or v in romanization
        }

        function softTokenHit(needle, haystack) {
            if (!needle) return false;
            if (haystack.includes(needle)) return true;
            const needleSkel = consonantSkeleton(needle);
            return haystack.split(' ').some(word => {
                if (!word) return false;
                if (word === needle) return true;
                // Containment only when clearly a stem (avoid leat≈lelo).
                if (word.length >= 4 && needle.length >= 4) {
                    if (word.startsWith(needle) || needle.startsWith(word)) return true;
                }
                const wordSkel = consonantSkeleton(word);
                // lev↔lb (לב), rakevet↔rkbt (רכבת)
                if (needleSkel.length >= 2 && needleSkel === wordSkel) return true;
                if (
                    needleSkel.length >= 3 &&
                    wordSkel.length >= 3 &&
                    needleSkel[0] === wordSkel[0] &&
                    editDistance(needleSkel, wordSkel) <= 1
                ) {
                    return true;
                }
                const minLen = Math.min(needle.length, word.length);
                if (minLen < 3) return false;
                if (needle[0] !== word[0]) return false;
                if (Math.abs(needle.length - word.length) > 2) return false;
                const dist = editDistance(needle, word);
                // Short romanized Hebrew tokens: allow 1 edit (leat≈lat).
                if (minLen <= 4) return dist <= 1;
                return dist <= 2;
            });
        }

        function softTokenCoverage(needles, haystack) {
            if (!needles.length) return 1;
            const hit = needles.filter(token => softTokenHit(token, haystack)).length;
            return hit / needles.length;
        }

        function videoMatchHaystack(video) {
            const rawTitle = String(video.title || '');
            const rawUploader = String(video.uploaderName || video.uploader || '');
            const latin = normalizeMatchText(`${rawTitle} ${rawUploader}`);
            const fromHebrew = transliterateHebrewApprox(`${rawTitle} ${rawUploader}`);
            return {
                haystack: `${latin} ${fromHebrew}`.trim(),
                uploaderHaystack: `${normalizeMatchText(rawUploader)} ${transliterateHebrewApprox(rawUploader)}`.trim(),
                hasHebrew: hasHebrew(rawTitle) || hasHebrew(rawUploader)
            };
        }

        function toYouTubeResult(video, fallbackTitle) {
            const id = String(video.url || '')
                .replace(/^.*watch\?v=/, '')
                .replace(/&.*$/, '');
            if (!id) return null;
            return {
                id,
                title: video.title || fallbackTitle,
                url: `https://www.youtube.com/watch?v=${id}`,
                uploader: video.uploaderName || video.uploader || '',
                duration: Number(video.duration || 0) || 0
            };
        }

        function scoreYouTubeCandidate(video, song, resultIndex) {
            const { haystack, uploaderHaystack, hasHebrew: videoHebrew } = videoMatchHaystack(video);
            const artistTokens = matchTokens(song.artist || '');
            const titleTokens = matchTokens(song.title || song.raw || '');
            const songHebrew = hasHebrew(song.artist) || hasHebrew(song.title) || hasHebrew(song.raw);
            const titleCov = softTokenCoverage(titleTokens, haystack);
            const artistCov = softTokenCoverage(artistTokens, haystack);
            const artistInUploader = artistTokens.length
                ? softTokenCoverage(artistTokens, uploaderHaystack)
                : 0;

            let score = titleCov * 45 + artistCov * 30;
            if (artistInUploader >= 0.8) score += 18;
            // Latin radio metadata + Hebrew YouTube title (common for Israeli songs).
            if (!songHebrew && videoHebrew && artistInUploader >= 0.6) score += 20;
            if (!songHebrew && videoHebrew && titleCov >= 0.5) score += 12;
            if (/official audio|\btopic\b/.test(haystack) || / topic$/.test(uploaderHaystack)) score += 22;
            if (/official (music )?video|\bvevo\b/.test(haystack)) score += 14;
            if (/\baudio\b/.test(haystack) && !/\blive\b/.test(haystack)) score += 8;

            if (/\blive\b|concert|session|unplugged|tour|festival|performance|from the/.test(haystack)) {
                score -= 40;
            }
            if (/\bcover\b|karaoke|remix|slowed|nightcore|sped up|8d audio|mashup|tribute|reaction|instrumental/.test(haystack)) {
                score -= 35;
            }
            if (/lyrics?/.test(haystack)) score -= 6;

            const duration = Number(video.duration || 0) || 0;
            if (duration > 0 && duration < 90) score -= 18;
            if (duration >= 120 && duration <= 480) score += 10;
            if (duration > 720) score -= 25;

            const views = Number(video.views || 0) || 0;
            if (views > 0) score += Math.min(10, Math.log10(views + 1));
            if (Number.isFinite(resultIndex)) score += Math.max(0, 12 - resultIndex);

            return {
                video,
                score,
                titleCov,
                artistCov,
                artistInUploader,
                videoHebrew,
                songHebrew
            };
        }

        function pickYouTubeResult(items, song) {
            const videos = (items || []).filter(item =>
                item && (item.type === 'stream' || item.type === 'musicSong' || (item.url && String(item.url).includes('watch?v=')))
            );
            if (!videos.length) return null;

            const scored = videos
                .map((video, index) => scoreYouTubeCandidate(video, song, index))
                .filter(entry => {
                    const artistKnown = matchTokens(song.artist || '').length > 0;
                    const crossScript =
                        !entry.songHebrew &&
                        entry.videoHebrew &&
                        entry.artistInUploader >= 0.6;

                    if (crossScript) {
                        // Artist channel + Hebrew title: title tokens may only match via transliteration.
                        return entry.titleCov >= 0.34 || entry.artistInUploader >= 0.8;
                    }
                    if (entry.titleCov < 0.55) return false;
                    if (artistKnown && entry.artistCov < 0.34) return false;
                    return true;
                })
                .sort((a, b) => b.score - a.score);

            if (!scored.length || scored[0].score < 36) return null;
            return toYouTubeResult(scored[0].video, songQuery(song));
        }

        async function searchYouTube(song) {
            const query = songQuery(song);
            const key = songCacheKey(song);
            if (ytCache.key === key && ytCache.video) return ytCache.video;

            const dashed = song.artist && song.title
                ? `${song.artist} - ${song.title}`
                : query;

            let lastError = null;
            const searches = [
                { q: query, filter: 'videos' },
                { q: dashed, filter: 'videos' },
                { q: query, filter: 'music_songs' },
                { q: `${query} official audio`, filter: 'videos' }
            ];

            for (const base of PIPED_INSTANCES) {
                const settled = await Promise.allSettled(searches.map(async search => {
                    const url = `${base}/search?q=${encodeURIComponent(search.q)}&filter=${search.filter}`;
                    const response = await fetch(url);
                    if (!response.ok) throw new Error('search failed');
                    const data = await response.json();
                    return data.items || data || [];
                }));

                const candidates = [];
                for (const result of settled) {
                    if (result.status === 'fulfilled') {
                        candidates.push(...result.value);
                    } else {
                        lastError = result.reason;
                    }
                }

                const best = pickYouTubeResult(candidates, song);
                if (best) {
                    ytCache = { key, video: best };
                    return best;
                }
            }

            throw lastError || new Error('No YouTube match found');
        }

        function triggerUrlDownload(url) {
            // Navigate only — never fetch() these CDN URLs (no CORS headers).
            // Hidden iframe keeps the radio page open while Content-Disposition attaches.
            const iframe = document.createElement('iframe');
            iframe.style.display = 'none';
            iframe.src = url;
            document.body.appendChild(iframe);
            setTimeout(() => iframe.remove(), 60000);
        }

        function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        function parseLoaderStart(text) {
            const data = extractJsonObject(text);
            if (data && data.progress_url) return data;

            const progressMatch = text.match(/"progress_url"\s*:\s*"((?:\\.|[^"\\])*)"/);
            if (!progressMatch) return null;
            try {
                return {
                    progress_url: JSON.parse('"' + progressMatch[1] + '"')
                };
            } catch (err) {
                return null;
            }
        }

        async function startLoaderJob(youtubeUrl) {
            // loader.to start endpoint is CORS-blocked; curl-engine proxy is fast for JSON APIs.
            const startUrl = 'https://loader.to/ajax/download.php?format=mp3&url='
                + encodeURIComponent(youtubeUrl);
            const response = await fetch('https://r.jina.ai/' + startUrl, {
                headers: {
                    Accept: 'text/plain',
                    'X-Engine': 'curl',
                    'X-Respond-With': 'text',
                    'X-Timeout': '20'
                }
            });
            if (!response.ok) throw new Error('MP3 start failed');
            const started = parseLoaderStart(await response.text());
            if (!started || !started.progress_url) {
                throw new Error('MP3 converter did not start');
            }
            return started;
        }

        async function waitForMp3Url(progressUrl, onStatus) {
            for (let i = 0; i < 90; i++) {
                if (i > 0) await sleep(1000);
                const progress = await fetch(progressUrl).then(r => r.json());
                if (progress.download_url) return progress.download_url;
                if (progress.success === 0 && /error|fail/i.test(progress.text || '')) {
                    throw new Error(progress.text || 'MP3 conversion failed');
                }
                if (onStatus) {
                    const pct = Number(progress.progress);
                    // Conversion runs on an external service; % is their queue/work, not local speed.
                    if (Number.isFinite(pct) && pct > 0) {
                        onStatus(`Waiting on converter… ${Math.min(99, Math.round(pct))}%`);
                    } else if (i === 0 || i % 3 === 0) {
                        onStatus(progress.text || 'Waiting on converter…');
                    }
                }
            }
            throw new Error('MP3 conversion timed out');
        }

        async function downloadMp3FromYouTube(youtubeUrl, filename, onStatus) {
            if (onStatus) onStatus('Preparing MP3…');
            const started = await startLoaderJob(youtubeUrl);
            if (onStatus) onStatus('Converting to MP3…');
            const downloadUrl = await waitForMp3Url(started.progress_url, onStatus);
            if (onStatus) onStatus('Saving file…');
            // Browser download navigation — avoids CORS on savenow/CDN hosts.
            triggerUrlDownload(downloadUrl);
            return true;
        }

        async function downloadCurrentSong() {
            if (!canDownloadSong(currentSong) || downloadBusy) return;

            downloadBusy = true;
            downloadBtn.disabled = true;
            downloadBtn.classList.add('busy');
            downloadStatus.textContent = 'Searching YouTube…';

            try {
                const query = songQuery(currentSong);
                const video = await searchYouTube(currentSong);
                downloadStatus.textContent = `Found: ${video.title}`;

                const safeName = (currentSong.raw || query)
                    .replace(/[<>:"/\\|?*]+/g, '')
                    .trim()
                    .slice(0, 80) || 'song';

                await downloadMp3FromYouTube(
                    video.url,
                    safeName + '.mp3',
                    text => { downloadStatus.textContent = text; }
                );
                downloadStatus.textContent = 'Download started.';
            } catch (err) {
                downloadStatus.textContent = 'Download failed — try again.';
                console.log(err);
            } finally {
                downloadBusy = false;
                downloadBtn.classList.remove('busy');
                downloadBtn.disabled = !canDownloadSong(currentSong);
            }
        }

        downloadBtn.addEventListener('click', downloadCurrentSong);
        identifyBtn.addEventListener('click', () => identifyCurrentSong());

        youtubeBtn.addEventListener('click', async () => {
            if (!canDownloadSong(currentSong)) return;
            youtubeBtn.disabled = true;
            downloadStatus.textContent = 'Opening YouTube…';
            try {
                const video = await searchYouTube(currentSong);
                window.open(video.url, '_blank', 'noopener,noreferrer');
                downloadStatus.textContent = video.title;
            } catch (err) {
                const q = encodeURIComponent(songQuery(currentSong));
                window.open('https://www.youtube.com/results?search_query=' + q, '_blank', 'noopener,noreferrer');
                downloadStatus.textContent = 'Opened YouTube search.';
            } finally {
                youtubeBtn.disabled = !canDownloadSong(currentSong);
            }
        });

        if (selectedChannel < 0 || selectedChannel >= channels.length) {
            selectedChannel = 0;
        }

        player.volume = 0.4;
        setControls();
        updateSource(selectedChannel);
    </script>
</body>
