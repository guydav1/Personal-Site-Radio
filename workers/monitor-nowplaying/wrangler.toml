# Cloudflare Worker: poll station now-playing every minute into KV.
# History is served at GET /history.json (no GitHub commits / Pages rebuilds).
#
# Deploy:
#   npx wrangler@latest deploy
# Optional one-time seed from local file (if KV is empty the Worker also seeds from HISTORY_SEED_URL):
#   npx wrangler@latest kv key put history --path=../../data/history.json --binding=HISTORY --remote
#
# Manual poll: GET / or GET /run
# Public history: GET /history.json

name = "radio-monitor-nowplaying"
main = "src/index.js"
compatibility_date = "2026-03-01"

[vars]
HISTORY_KEY = "history"
HISTORY_SEED_URL = "https://raw.githubusercontent.com/guydav1/Personal-Site-Radio/main/data/history.json"

[[kv_namespaces]]
binding = "HISTORY"
id = "57dee50f4d064d168a8d563d66a40039"

[triggers]
crons = ["* * * * *"]
