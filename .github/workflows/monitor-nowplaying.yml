# Dedicated station now-playing monitor (independent of the live radio player).
name: Monitor now playing

on:
  schedule:
    # GitHub will not reliably run cron denser than every 5 minutes.
    # Offset from :00/:30 to reduce schedule congestion.
    - cron: '2,7,12,17,22,27,32,37,42,47,52,57 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: monitor-nowplaying
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Poll station now-playing feeds
        env:
          # Loop inside the job (~4.5 min @ 60s) to approximate 1-minute sampling.
          MONITOR_DURATION_MS: '270000'
          MONITOR_INTERVAL_MS: '60000'
        run: node scripts/monitor-nowplaying.mjs

      - name: Commit history if changed
        run: |
          if git diff --quiet -- data/history.json; then
            echo "No history changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history.json
          git commit -m "Update song history from now-playing monitor."
          git push
